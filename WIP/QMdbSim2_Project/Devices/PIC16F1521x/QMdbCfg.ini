[QMdbCfg]
; MPLAB X installation root.  All MPLAB X paths are derived from this.
MplabxRoot=C:\Program Files\Microchip\MPLABX\v6.30

; JDK/JRE installation root.  jvm.dll is derived as:
;   <JdkRoot>\jre\bin\server\jvm.dll
;
; IMPORTANT: QSpice is a 32-bit application.  JdkRoot MUST point to a 32-bit
; JRE.  The JRE bundled with MPLabX is 64-bit and will NOT work.  Install a
; separate 32-bit JRE (e.g. Zulu or Eclipse Temurin 32-bit) and set JdkRoot
; to that installation.  Using a 64-bit JRE will be detected at load time and
; reported as an error.
;
; JdkRoot=C:\Program Files\Eclipse Adoptium\jdk-8.0.492.9-hotspot
; JdkRoot=C:\Program Files (x86)\Eclipse Adoptium\jdk-8.0.472.8-hotspot\jre
;;JdkRoot=C:\Program Files (x86)\Eclipse Adoptium\jdk-8.0.472.8-hotspot
JdkRoot=C:\Program Files (x86)\Eclipse Adoptium\jdk-17.0.17.10-hotspot

; Full path to qmdbcs.jar (fat JAR: QMdbCS facade + all MDBCS classes).
; Built by "ant jar" in mplab-x-sdk_v6.30\mdbcs\mdbcs\ -- produces dist\qmdbcs.jar.
; Note: dist\mdbcs.jar is also produced but is no longer referenced at runtime.
; QMdbcsJar=C:\Dev\QSpice\Projects\QMdbSim2_Project\Java_API\mplab-x-sdk_v6.30\mdbcs\mdbcs\dist\qmdbcs.jar
QMdbcsJar=..\..\Java_API\mplab-x-sdk_v6.30\mdbcs\mdbcs\dist\qmdbcs.jar

